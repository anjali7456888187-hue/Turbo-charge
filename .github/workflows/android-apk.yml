name: Turbo Charge Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/admin-apk.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TurboCharge.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turbo Charge
          path: TurboCharge.apk
          if-no-files-found: error

  android-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Turbo Charge
          path: apk
      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: sh .github/scripts/android-smoke-test.sh

  publish-release:
    needs: android-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Turbo Charge
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Turbo Charge Android build ${{ github.run_number }}
          body: "Turbo Charge Android APK. Install the update after downloading."
          files: TurboCharge.apk
          make_latest: true
