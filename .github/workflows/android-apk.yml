name: Turbo Charge Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: turbo-charge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: turbo-charge-debug-apk
          path: apk
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 emulator system-images;android-35;default;x86_64'
      - name: Create and boot Android emulator
        run: |
          set -eu
          echo no | avdmanager create avd --force -n turbo-charge-test -k 'system-images;android-35;default;x86_64'
          emulator -avd turbo-charge-test -port 5554 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off > /tmp/turbo-charge-emulator.log 2>&1 &
          adb start-server
          booted=0
          for attempt in $(seq 1 180); do
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; then
              booted=1
              break
            fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "Emulator failed to boot within 15 minutes."
            tail -200 /tmp/turbo-charge-emulator.log || true
            exit 1
          fi
          echo "Android emulator boot completed."
      - name: Install, launch and check APK
        run: sh .github/scripts/android-smoke-test.sh
