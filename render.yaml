services:
  - type: web
    name: turbo-charge-ar-s1-server
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_API_TOKEN
        sync: false
      - key: DASHBOARD_ALLOWED_ORIGINS
        sync: false
